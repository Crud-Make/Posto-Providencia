# Banco local do Posto Providência — Postgres 17, mesma major do projeto Supabase (17.6).
#
#   docker compose up -d --wait            # sobe e aplica banco/init/*.sql na primeira vez
#   docker compose exec -T postgres psql -U posto -d posto < banco/dados/cadastros.sql
#   docker compose down -v                 # zera (o volume é apagado; o init roda de novo)
#
# Porta 5433 no host para não brigar com um Postgres local em 5432.
# `api` é o backend Laravel (backend/), em modo dev: código montado por volume, `artisan serve`.
#   docker compose up -d --wait api            # sobe postgres + api; http://localhost:8000/api/saude

services:
  postgres:
    image: postgres:17
    container_name: posto-postgres
    environment:
      POSTGRES_USER: posto
      POSTGRES_PASSWORD: posto
      POSTGRES_DB: posto
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - ./banco/init:/docker-entrypoint-initdb.d:ro
      - posto-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posto -d posto"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    container_name: posto-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      APP_URL: http://localhost:8000
      PHP_CLI_SERVER_WORKERS: 4
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(str_contains(file_get_contents(\"http://127.0.0.1:8000/api/saude\"), \"ok\") ? 0 : 1);'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  posto-pg:
