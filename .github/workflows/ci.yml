name: CI

on:
  push:
    branches: [ main, release, fase-a ]
  # Toda PR roda CI, inclusive as empilhadas (base em outra branch de trabalho): a proteção da
  # main e da fase-a exige os checks `build` e `backend` verdes.
  # `labeled`/`unlabeled` entram em 19/09/2026 por causa do passo "Catraca só desce": o rótulo
  # `aceita-divida` é lido do PAYLOAD do evento. Sem `types`, o padrão é só opened/synchronize/
  # reopened — pôr o rótulo depois do CI vermelho não refazia o job, e um re-run usa o payload
  # antigo, sem o rótulo. Agora rotular dispara uma rodada nova com o payload novo. Custo: os dois
  # jobs rodam de novo a cada rótulo posto ou tirado, que é raro.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  build:
    runs-on: ubuntu-latest
    # A toolchain TS mora em frontend/ desde a #95 (17/09/2026); backend/ (Laravel) ganha job próprio na #96.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      # Toolchain é Bun (Regra Zero do CLAUDE.md). O script `build` chama `bun -e`
      # internamente, então o runner Node+npm anterior nunca conseguiria completar.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # oxlint é o lint padrão (0,2 s contra 23 s do eslint na base de 17/09); o eslint fica
      # como passada completa no CI, onde o tempo não pesa.
      - name: Lint (oxlint)
        run: bun run lint

      - name: Lint (eslint, passada completa)
        run: bun run lint:eslint

      # A catraca só desce (19/09/2026). `lint:eslint` e `type-check` conferem a árvore contra a
      # PRÓPRIA lista congelada — quem sobe um número em .catraca/*.json à mão passa verde nos
      # dois. Este passo compara a lista do PR com a da base: chave que subiu ou apareceu
      # reprova, salvo o rótulo `aceita-divida` no PR (decisão do dono, dita na descrição).
      # O checkout é raso, por isso a base é buscada antes.
      - name: Catraca só desce (verificar-base)
        if: github.event_name == 'pull_request'
        env:
          ACEITA_DIVIDA: ${{ contains(github.event.pull_request.labels.*.name, 'aceita-divida') && '1' || '0' }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          bun run catraca:verificar-base "${{ github.event.pull_request.base.sha }}"

      - name: Type-check
        run: bun run type-check

      # Só o vitest: nenhum dos 6 arquivos toca em docs/data (ver nota no fim do arquivo).
      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  backend:
    # Quality gates do CLAUDE.md §6 para o Laravel (backend/): Pint, PHPStan, PHPMD, Deptrac, Pest.
    # Cobertura mínima (85 %) entra quando houver código de domínio para cobrir (#97).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: posto
          POSTGRES_PASSWORD: posto
          POSTGRES_DB: posto
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U posto -d posto"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v5
      # Os testes de Feature rodam contra o esquema real de produção (banco/init), sem migration.
      - name: Carrega o esquema do posto no Postgres do job
        run: |
          psql "postgresql://posto:posto@localhost:5432/posto" -v ON_ERROR_STOP=1 \
            -f ../banco/init/00-papeis-e-stubs.sql -f ../banco/init/01-esquema-base.sql
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, mbstring, zip
          coverage: xdebug
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Gates (pint, phpstan, phpmd, deptrac, pest)
        run: composer gates

  # Os golden masters (`bun run test:golden`) NÃO rodam aqui de propósito: dependem de
  # docs/data/*.sqlite, que é fonte auditável local e ficou gitignored em 2026-07-29
  # (dado financeiro real nunca vai pro git). Continuam sendo o portão obrigatório de
  # qualquer mudança de fórmula, mas rodados na máquina — ver seção 7 do CLAUDE.md.
