name: CI

on:
  push:
    branches: [ main, release, fase-a ]
  # Toda PR roda CI, inclusive as empilhadas (base em outra branch de trabalho): a proteção da
  # main e da fase-a exige os checks `build` e `backend` verdes.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # A toolchain TS mora em frontend/ desde a #95 (17/09/2026); backend/ (Laravel) ganha job próprio na #96.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      # Toolchain é Bun (Regra Zero do CLAUDE.md). O script `build` chama `bun -e`
      # internamente, então o runner Node+npm anterior nunca conseguiria completar.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # oxlint é o lint padrão (0,2 s contra 23 s do eslint na base de 17/09); o eslint fica
      # como passada completa no CI, onde o tempo não pesa.
      - name: Lint (oxlint)
        run: bun run lint

      - name: Lint (eslint, passada completa)
        run: bun run lint:eslint

      - name: Type-check
        run: bun run type-check

      # Só o vitest: nenhum dos 6 arquivos toca em docs/data (ver nota no fim do arquivo).
      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  backend:
    # Quality gates do CLAUDE.md §6 para o Laravel (backend/): Pint, PHPStan, PHPMD, Deptrac, Pest.
    # Cobertura mínima (85 %) entra quando houver código de domínio para cobrir (#97).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, mbstring, zip
          coverage: xdebug
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Gates (pint, phpstan, phpmd, deptrac, pest)
        run: composer gates

  # Os golden masters (`bun run test:golden`) NÃO rodam aqui de propósito: dependem de
  # docs/data/*.sqlite, que é fonte auditável local e ficou gitignored em 2026-07-29
  # (dado financeiro real nunca vai pro git). Continuam sendo o portão obrigatório de
  # qualquer mudança de fórmula, mas rodados na máquina — ver seção 7 do CLAUDE.md.
